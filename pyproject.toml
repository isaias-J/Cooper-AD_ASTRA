[project]
name = "cooper-codefest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4==4.13.5", "faiss-cpu==1.12.0", "langdetect==1.0.9",
  "openpyxl==3.1.5", "pymupdf==1.26.4", "sentence-transformers==5.1.0",
  "torch==2.9.1", "mapbox-vector-tile==2.2.0", "pillow==11.3.0", "pytesseract==0.3.13",
  "reportlab==4.4.3", "pytest==8.4.1"
